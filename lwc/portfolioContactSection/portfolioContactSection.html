<template>
    <div class="container" if:true={submitMessage}>
        <p class="headline">{submitMessage}</p>
    </div>
    <div class="container" if:false={submitMessage}>
        <div class="header">
            <p class="headline">Send me a message!</p>
            <p class="subheading">Got a question or proposal, or just want to say hello? Go ahead.</p>
        </div>
        <div class="details">
            <form onsubmit={createContactRecord}>
                <div class="textfield">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="firstname" placeholder="Your name.." onchange={getName} required maxlength="40">

                    <label for="email">Email Address</label>
                    <input type="text" id="email" name="emailid" placeholder="username@example.com" onblur={validateEmail} oninput={handleTyping} required pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,4}$">
                    <div class="error-message" if:true={emailError}>{emailError}</div>
                </div>
                <div class="field">
                    <label for="subject">Your Message</label>
                    <textarea id="subject" name="subject" placeholder="Write something.." style="height:200px" onchange={getMessage} required></textarea>
                </div>
                <div class="button">
                    <input type="submit" value="Shoot" disabled={isSubmitDisabled}>
                </div>
            </form>
        </div>
    </div>
</template>
